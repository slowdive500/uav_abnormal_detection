[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-abnormality-detection"
version = "0.1.0"
description = "Condition alignment, PRBTD and TSAD-C for UAV crowdsensing contribution quality"
requires-python = ">=3.8"
dependencies = ["numpy>=1.24,<2", "pandas>=1.5,<2.1", "scipy>=1.10,<1.11; python_version<'3.9'", "scipy>=1.10; python_version>='3.9'", "torch>=2.4,<2.6", "scikit-learn>=1.0", "PyYAML>=6", "xarray>=2023.1,<2024; python_version<'3.9'", "xarray>=2023.1; python_version>='3.9'", "netCDF4>=1.6,<1.7", "einops>=0.6,<0.9", "opt-einsum>=3.3", "h5py>=3.8,<4"]

[project.optional-dependencies]
test = ["pytest>=7,<9"]
perception = ["torchvision==0.19.1", "Pillow>=9,<11"]

[project.scripts]
uav-ad = "uav_abnormality.cli:main"

[tool.setuptools.packages.find]
include = ["uav_abnormality*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
