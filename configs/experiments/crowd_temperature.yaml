algorithm: condition_alignment
seed: 42
data:
  path: data/processed/crowd_temperature_v2.csv
split:
  mode: chronological
  ratios:
  - 0.4
  - 0.1
  - 0.3
  - 0.2
window:
  window_size: 2
  min_sources: 3
  max_gap_seconds: 1800.1
protocol_feasibility:
  enabled: true
  min_scored_attacks_per_split: 1
  min_retained_calibration_units: 40
training:
  device: auto
  threads: 1
  epochs: 20
  patience: 5
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0
scoring:
  reputation_scope: source
calibration:
  alpha: 0.05
corruption:
  train:
    protocol: targeted_report_attack
    assume_unlabelled_normal: true
    source_fraction: 0.25
    source_selection_seed: 6113
    coalition_sizes: [1, 2]
    max_local_fraction: 0.49
    report_fraction: 1.0
    persistence: sustained
    source_selection_mode: present_compromised_pool
    start_offset_rounds: 1
    max_gap_seconds: 1800.1
    kinds: [target_bias, change_suppression]
    constraints:
      target_delta_sigma: 0.75
      max_delta_sigma: 1.0
      max_delta_step_sigma: 0.25
      min_effect_sigma: 0.1
  validation:
    protocol: targeted_report_attack
    assume_unlabelled_normal: true
    source_fraction: 0.25
    source_selection_seed: 6113
    coalition_sizes: [1, 2]
    max_local_fraction: 0.49
    report_fraction: 1.0
    persistence: sustained
    source_selection_mode: present_compromised_pool
    start_offset_rounds: 1
    max_gap_seconds: 1800.1
    kinds: [target_bias, change_suppression]
    constraints:
      target_delta_sigma: 0.75
      max_delta_sigma: 1.0
      max_delta_step_sigma: 0.25
      min_effect_sigma: 0.1
  calibration:
    protocol: targeted_report_attack
    assume_unlabelled_normal: true
    source_fraction: 0.25
    source_selection_seed: 6113
    coalition_sizes: [1, 2]
    max_local_fraction: 0.49
    report_fraction: 1.0
    persistence: sustained
    source_selection_mode: present_compromised_pool
    start_offset_rounds: 1
    max_gap_seconds: 1800.1
    kinds: [target_bias, change_suppression]
    constraints:
      target_delta_sigma: 0.75
      max_delta_sigma: 1.0
      max_delta_step_sigma: 0.25
      min_effect_sigma: 0.1
  test:
    protocol: targeted_report_attack
    assume_unlabelled_normal: true
    source_fraction: 0.25
    source_selection_seed: 6113
    coalition_sizes: [1, 2]
    max_local_fraction: 0.49
    report_fraction: 1.0
    persistence: sustained
    source_selection_mode: present_compromised_pool
    start_offset_rounds: 1
    max_gap_seconds: 1800.1
    kinds: [target_bias, change_suppression]
    constraints:
      target_delta_sigma: 0.75
      max_delta_sigma: 1.0
      max_delta_step_sigma: 0.25
      min_effect_sigma: 0.1
models:
  prbtd:
    d_model: 16
    d_inner: 32
    growth_rate: 4
    max_iter: 30
  tsadc:
    hidden_dim: 16
    state_dim: 8
    diffusion_steps: 10
    score_samples: 2
  condition_alignment:
    architecture: mlp
    hidden_dim: 32
    min_references: 2
    tau0: 0.1
    huber_delta: 1.0
evaluation:
  # Minimum experimental effect in original units, not an operational safety limit.
  attack_harm_threshold: 0.2
  attack_min_harm_rounds: 1
  attack_harm_objective: instantaneous_error
method:
  condition_columns:
  - condition_latitude
  - condition_longitude
  reputation:
    initial: 0.5
    eta_up: 0.05
    eta_down: 0.25
  environment:
    min_sources: 3
    max_neighbors: 8
  calibration:
    alpha: 0.05
    budget: auto
    verification: injected_fault_oracle
    selection_seed: 42
    separation_seconds: 3600
