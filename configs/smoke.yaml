algorithm: prbtd
seed: 42
data:
  path: data/fixtures/reports.csv
split:
  mode: sequence
  ratios: [0.5, 0.125, 0.125, 0.25]
window:
  window_size: 8
  min_sources: 3
  max_gap_seconds: 5.1
training:
  device: cpu
  threads: 1
  epochs: 2
  patience: 2
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0
calibration:
  alpha: 0.05
corruption:
  train: &train_faults
    assume_unlabelled_normal: true
    source_fraction: 0.2
    report_fraction: 0.05
    magnitude: 3.0
    duration: 4
    kinds: [offset, drift, spike, stuck, replay]
  validation: *train_faults
  calibration: *train_faults
  test:
    assume_unlabelled_normal: true
    source_fraction: 0.2
    report_fraction: 0.3
    magnitude: 4.0
    duration: 8
    kinds: [offset, drift, spike, stuck, replay]
